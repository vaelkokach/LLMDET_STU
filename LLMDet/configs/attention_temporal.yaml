seed: 42

detector:
  config_path: "configs/grounding_dino_swin_t.py"
  checkpoint_path: "work_dirs/grounding_dino_swin_t/iter_15000.pth"
  text_prompt: "student"
  score_thr: 0.28
  max_det: 80
  min_rel_area: 0.003
  max_rel_area: 0.80
  min_aspect_ratio: 0.12
  max_aspect_ratio: 1.60
  nms_iou_thr: 0.5
  device: "cuda:0"

tracking:
  iou_match_thr: 0.20
  max_age: 60
  min_hits: 4
  appearance_weight: 0.35
  min_match_score: 0.25

features:
  clip_model_name: "openai/clip-vit-base-patch32"
  device: "cuda:0"

model:
  input_dim: 544
  hidden_dim: 512
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  num_classes: 4
  max_seq_len: 128

data:
  sequence_dir: "../grounding_data/stu_img/attention_sequences"

training:
  mode: "supervised" # supervised | semi_supervised
  pseudo_label_threshold: 0.7
  use_class_weights: true
  enforce_full_class_coverage: true
  required_min_per_class: 1
  epochs: 30
  batch_size: 32
  num_workers: 4
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  amp: true
  output_dir: "work_dirs/attention_temporal"

inference:
  window_size: 32
  min_frames_for_pred: 6
  label_smooth_window: 7
  label_switch_margin: 1

privacy:
  anonymize_faces: false

temporal_checkpoint: "work_dirs/attention_temporal/checkpoints/best.pth"
